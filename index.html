<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Solar Monitor | System Input</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #0b2b3b 0%, #1a4a5f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card-custom {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .input-group-custom {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }
        .input-group-custom:focus-within {
            border-color: #ffb347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.3);
        }
        .input-group-custom i {
            color: #ffb347;
            font-size: 1.3rem;
        }
        .form-control-custom {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            padding: 0.6rem 0.5rem;
            outline: none;
        }
        .form-control-custom:focus {
            background: transparent;
            color: white;
            box-shadow: none;
        }
        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .btn-predict {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .btn-predict:hover {
            transform: scale(1.02);
            background: linear-gradient(90deg, #e67e22, #f39c12);
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
        }
        h2 {
            color: #ffd966;
            font-weight: 600;
            border-left: 6px solid #ffb347;
            padding-left: 20px;
        }
        label {
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #e0f2fe;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number]{
            -moz-appearance: textfield;
            appearance: textfield;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .card-custom { padding: 1.5rem !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-12">
            <div class="card card-custom p-4 p-md-5 text-white">
                <div class="text-center mb-4">
                    <i class="fas fa-solar-panel fa-3x text-warning"></i>
                    <h1 class="mt-3 fw-bold" style="color: #ffdd99;">Solar Panel</h1>
                    <h4 class="text-light-50">Monitoring & Maintenance System</h4>
                </div>
                
                <h2 class="mb-4"><i class="fas fa-tasks me-2"></i> Instructions</h2>
                <p class="text-center">Enter Sensor Readings for Instant Analysis</p>
                
                <form id="predictForm">
                    <!-- Voltage Field -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="fas fa-bolt me-2"></i>Voltage (V)</label>
                        <div class="input-group-custom d-flex align-items-center">
                            <i class="fas fa-charging-station me-2"></i>
                            <input type="number" step="any" class="form-control-custom w-100" id="voltage" placeholder="e.g., 24.6" required>
                        </div>
                        <div class="form-text">Range 18V - 30V for 24V systems</div>
                    </div>
                    
                    <!-- Current Field -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold"><i class="fas fa-water me-2"></i>Current (A)</label>
                        <div class="input-group-custom d-flex align-items-center">
                            <i class="fas fa-water me-2"></i>
                            <input type="number" step="any" class="form-control-custom w-100" id="current" placeholder="e.g., 5.2" required>
                        </div>
                        <div class="form-text">Range 0A - 15A</div> 
                    </div>
                    
                    <!-- Panel Temp Field -->
                    <div class="mb-5">
                        <label class="form-label fw-semibold"><i class="fas fa-thermometer-half me-2"></i>Panel Temp (°C)</label>
                        <div class="input-group-custom d-flex align-items-center">
                            <i class="fas fa-temperature-high me-2"></i>
                            <input type="number" step="any" class="form-control-custom w-100" id="temp" placeholder="e.g., 45.0" required>
                        </div>
                        <div class="form-text">Operating range -10°C to 85°C</div>
                    </div>
                    
                    <!-- Predict Button -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-predict">
                            <i class="fas fa-microchip me-2"></i> Predict
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4 small opacity-75">
                    <i class="fas fa-chart-line"></i> Fault Prediction System
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Handle form submission and store data in localStorage to pass to result page
    document.getElementById('predictForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Get values
        const voltage = parseFloat(document.getElementById('voltage').value);
        const current = parseFloat(document.getElementById('current').value);
        const temperature = parseFloat(document.getElementById('temp').value);
        
        // Basic validation
        if (isNaN(voltage) || isNaN(current) || isNaN(temperature)) {
            alert("Please enter valid numeric values for Voltage, Current and Temperature.");
            return;
        }
        
        // Store in localStorage
        const sensorData = {
            voltage: voltage,
            current: current,
            temperature: temperature
        };
        localStorage.setItem('solarData', JSON.stringify(sensorData));
        
        // Redirect to prediction page
        window.location.href = 'result.html';
    });
</script>

<!-- Bootstrap JS Bundle (optional for toggles, but good practice) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
