<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Solar Monitor | Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b2b3b 0%, #1a4a5f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* Login Card */
        .login-card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            padding: 2rem 1.8rem;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header i {
            font-size: 3rem;
            color: #ffd966;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            color: #ffd966;
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 0.25rem;
        }

        .login-header h4 {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
        }

        /* Input Groups */
        .input-group-custom {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            margin-bottom: 1.2rem;
        }

        .input-group-custom:focus-within {
            border-color: #ffb347;
            box-shadow: 0 0 0 3px rgba(255, 180, 71, 0.3);
        }

        .input-group-custom i {
            color: #ffb347;
            font-size: 1.2rem;
            width: 30px;
        }

        .form-control-custom {
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 0.5rem 0;
            outline: none;
            width: 100%;
        }

        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control-custom:focus {
            background: transparent;
            color: white;
            box-shadow: none;
        }

        /* Login Button */
        .btn-login {
            background: linear-gradient(90deg, #f39c12, #e67e22);
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            color: white;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: linear-gradient(90deg, #e67e22, #f39c12);
            transform: scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: white;
            font-size: 0.8rem;
        }

        .login-footer i {
            color: inherit;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Header -->
    <div class="login-header">
        <i class="fas fa-solar-panel fa-3x text-warning"></i>
        <h1>Solar Panel</h1>
        <h4 class="text-light-50">Monitoring & Maintenance System</h4>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <!-- Username Field -->
        <div class="input-group-custom d-flex align-items-center">
            <i class="fas fa-user"></i>
            <input type="text" class="form-control-custom" id="username" placeholder="Username" required autocomplete="off">
        </div>

        <!-- Password Field -->
        <div class="input-group-custom d-flex align-items-center">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-control-custom" id="password" placeholder="Password" required>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
    </form>
    
<script>
    // Get form element
    const loginForm = document.getElementById('loginForm');

    // Handle form submission - Accept ANY username and password
    loginForm.addEventListener('submit', function(event) {
        event.preventDefault();
        
        // Get input values (not validated)
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        // Check if fields are not empty
        if (username === '' || password === '') {
            alert('Please enter both username and password.');
            return;
        }
        
        // Store user info in localStorage (optional)
        const userSession = {
            username: username,
            loginTime: new Date().toISOString()
        };
        localStorage.setItem('userSession', JSON.stringify(userSession));
        
        // Redirect to main input page
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
